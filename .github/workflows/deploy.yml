name: Deploy to GitHub Pages

# Every push to the default branch rebuilds and publishes the site.
# Nothing is committed by this workflow: dist/ is built here and handed
# straight to Pages, so the repo never carries generated HTML.

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Reads .nvmrc so CI and your laptop cannot drift.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs the exact tree in package-lock.json. It fails loudly
      # if the lockfile and package.json disagree, which is what you want in CI.
      - run: npm ci

      # `npm run build` runs `astro check` first, so a typo in any content file
      # fails the deploy instead of publishing a broken page.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
